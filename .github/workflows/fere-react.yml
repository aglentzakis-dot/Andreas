name: Τοπικό αντίγραφο React
on:
  push:
    paths: [".github/workflows/fere-react.yml"]
permissions:
  contents: write
jobs:
  fere:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Λήψη React 18.3.1 από το npm (με έλεγχο ακεραιότητας)
        run: |
          set -e
          mkdir -p /tmp/r lib && cd /tmp/r
          npm pack react@18.3.1 react-dom@18.3.1
          tar -xzf react-18.3.1.tgz && cp package/umd/react.production.min.js "$GITHUB_WORKSPACE/lib/" && rm -rf package
          tar -xzf react-dom-18.3.1.tgz && cp package/umd/react-dom.production.min.js "$GITHUB_WORKSPACE/lib/"
          cd "$GITHUB_WORKSPACE" && sha256sum lib/*.js
          git rm -q .github/workflows/fere-react.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib && git commit -m "Τοπικό αντίγραφο React 18.3.1 (λειτουργία χωρίς ίντερνετ)" && git push
